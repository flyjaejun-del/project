<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEAM 포물선 심화 분석기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range] { accent-color: #fbbf24; height: 6px; }
        body { touch-action: manipulation; transition: background 0.3s, color 0.3s; }
        .theme-dark { background-color: #0f172a; color: #f1f5f9; }
        .theme-light { background-color: #f8fafc; color: #1e293b; }
        .bg-card { transition: background 0.3s; }
        .theme-dark .bg-card { background-color: #1e293b; border-color: #334155; }
        .theme-light .bg-card { background-color: #ffffff; border-color: #e2e8f0; }
    </style>
</head>
<body class="theme-dark flex flex-col h-screen overflow-hidden">

    <header class="p-3 shadow-md border-b flex justify-between items-center bg-card">
        <h1 class="text-lg font-bold text-yellow-500">STEAM 포물선 심화 분석기</h1>
        <button id="btn-theme" class="text-xs px-3 py-1 rounded bg-slate-700 text-white">테마 변경</button>
    </header>

    <main class="flex-grow overflow-y-auto p-2 space-y-3">
        <div class="rounded-lg border h-64 relative overflow-hidden bg-card" id="canvasContainer">
            <canvas id="simCanvas"></canvas>
        </div>

        <div class="p-4 rounded-lg border space-y-4 bg-card">
            <div class="space-y-1">
                <div class="flex justify-between text-xs font-medium"><span>속도(m/s)</span><span id="val-v">30</span></div>
                <input type="range" id="v" min="5" max="80" value="30" class="w-full">
            </div>
            <div class="space-y-1">
                <div class="flex justify-between text-xs font-medium"><span>각도(°)</span><span id="val-a">45</span></div>
                <input type="range" id="a" min="0" max="90" value="45" class="w-full">
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold block">행성 선택</label>
                <select id="planet" class="w-full text-sm p-3 rounded border bg-slate-700 font-bold border-yellow-500 text-white">
                    <option value="9.8">지구 (중력: 9.8m/s²)</option>
                    <option value="1.62">달 (중력: 1.62m/s²)</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button id="btn-clear" class="flex-1 py-3 rounded text-sm font-bold bg-slate-600 text-white">초기화</button>
                <button id="btn-launch" class="flex-1 py-3 rounded text-sm font-bold bg-yellow-600 hover:bg-yellow-500 text-white shadow-[0_0_15px_rgba(245,158,11,0.4)]">발사</button>
            </div>
        </div>

        <div class="rounded-lg border overflow-hidden bg-card">
            <table class="w-full text-xs text-center border-collapse">
                <thead>
                    <tr class="bg-slate-700 text-white">
                        <th class="p-2 border border-slate-600">각도</th>
                        <th class="p-2 border border-slate-600">속도</th>
                        <th class="p-2 border border-slate-600">비행시간</th>
                        <th class="p-2 border border-slate-600">이동거리</th>
                    </tr>
                </thead>
                <tbody id="data-table"></tbody>
            </table>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const vInput = document.getElementById('v'), aInput = document.getElementById('a');
        const valV = document.getElementById('val-v'), valA = document.getElementById('val-a');
        const table = document.getElementById('data-table');
        const body = document.body;
        
        let trajectories = [];
        let particles = []; 
        let scale = 1.3; 

        document.getElementById('btn-theme').onclick = () => {
            body.classList.toggle('theme-dark');
            body.classList.toggle('theme-light');
        };

        vInput.oninput = () => valV.innerText = vInput.value;
        aInput.oninput = () => valA.innerText = aInput.value;

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            scale = (canvas.height - 60) / 150;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawAxes() {
            const isDark = body.classList.contains('theme-dark');
            ctx.strokeStyle = isDark ? '#475569' : '#cbd5e1';
            ctx.fillStyle = isDark ? '#94a3b8' : '#64748b';
            ctx.font = '10px Arial';
            ctx.lineWidth = 1;

            ctx.beginPath();
            ctx.moveTo(40, canvas.height - 30);
            ctx.lineTo(canvas.width - 10, canvas.height - 30);
            ctx.lineTo(40, canvas.height - 30);
            ctx.lineTo(40, 20);
            ctx.stroke();

            // 가로축 (이동거리) 눈금 그리기 (10m 단위 눈금 표시, 50m 단위 수치 기입)
            const maxMetersX = (canvas.width - 50) / scale;
            for (let m = 0; m <= maxMetersX; m += 10) {
                const x = 40 + m * scale;
                ctx.beginPath();
                ctx.moveTo(x, canvas.height - 30);
                
                if (m % 50 === 0) {
                    ctx.lineTo(x, canvas.height - 23); // 50m 단위는 긴 눈금선
                    ctx.stroke();
                    ctx.fillText(m + 'm', x - 8, canvas.height - 10);
                } else {
                    ctx.lineTo(x, canvas.height - 27); // 10m 단위는 짧은 눈금선
                    ctx.stroke();
                }
            }

            // 세로축 (높이) 눈금 그리기 (10m 단위로 최대 150m까지 표시)
            for (let i = 0; i <= 15; i++) {
                const y = canvas.height - 30 - i * 10 * scale;
                if (y >= 15) {
                    ctx.beginPath();
                    ctx.moveTo(40, y);
                    ctx.lineTo(35, y);
                    ctx.stroke();
                    ctx.fillText(i * 10 + 'm', 10, y + 3);
                }
            }
        }

        function createSparkle(x, y, color) {
            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    size: Math.random() * 2.5 + 1,
                    alpha: 1.0,
                    color: color
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color;
                    ctx.fillStyle = '#ffffff'; 
                    
                    const px = 40 + p.x * scale;
                    const py = canvas.height - 30 - p.y * scale;
                    
                    ctx.beginPath();
                    ctx.arc(px, py, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawAxes();

            trajectories.forEach(t => {
                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = t.color;
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 6;
                ctx.shadowColor = t.color;
                t.pts.forEach((p, i) => {
                    const x = 40 + p.x * scale, y = canvas.height - 30 - p.y * scale;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.stroke();
                ctx.restore();

                if (t.active) {
                    const x = 40 + t.currX * scale, y = canvas.height - 30 - t.currY * scale;
                    
                    createSparkle(t.currX, t.currY, t.color);

                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = t.color;
                    ctx.fillStyle = t.color;
                    ctx.beginPath();
                    ctx.arc(x, y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            updateAndDrawParticles();
            requestAnimationFrame(render);
        }

        document.getElementById('btn-launch').onclick = () => {
            const v = +vInput.value, angle = +aInput.value * Math.PI / 180, g = +document.getElementById('planet').value;
            const color = g < 2 ? '#fef08a' : '#f59e0b';
            const sim = { v, angle, g, pts: [], t: 0, color: color, currX: 0, currY: 0, active: true };
            trajectories.push(sim);
            
            function animate() {
                sim.t += 0.15;
                sim.currX = v * Math.cos(sim.angle) * sim.t;
                sim.currY = v * Math.sin(sim.angle) * sim.t - 0.5 * g * sim.t * sim.t;
                
                if (sim.currY < 0) {
                    sim.active = false;
                    table.insertRow().innerHTML = `
                        <td class="p-2 border">${aInput.value}°</td>
                        <td class="p-2 border">${v} m/s</td>
                        <td class="p-2 border">${sim.t.toFixed(1)}s</td>
                        <td class="p-2 border">${sim.currX.toFixed(1)}m</td>
                    `;
                    return;
                }
                sim.pts.push({ x: sim.currX, y: sim.currY });
                setTimeout(animate, 25);
            }
            animate();
        };

        document.getElementById('btn-clear').onclick = () => { 
            trajectories = []; 
            particles = [];
            table.innerHTML = ''; 
        };

        render();
    </script>
</body>
</html>
